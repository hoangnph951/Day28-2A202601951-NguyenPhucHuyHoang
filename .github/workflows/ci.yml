name: student-ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
      - run: uv sync --frozen --extra dev --extra integration --no-editable
      - run: uv run ruff check .
      - name: Verify completed learner work
        run: uv run pytest starter-tests tests -q
      - run: uv run python scripts/verify_matrix.py
      - run: uv run python scripts/check_portability.py
      - run: uv run python scripts/validate_manifests.py
